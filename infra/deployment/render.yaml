# Render Blueprint Infrastructure-as-Code Manifest
# Project: Hybrid AI-Powered Multilingual Plagiarism Detection and Analysis System
# Reference Deployment Architecture

services:
  # 1. Frontend Web Service (React SPA via Nginx)
  - type: web
    name: plagiarism-web
    env: docker
    dockerfilePath: apps/web/Dockerfile
    dockerContext: apps/web
    plan: starter
    region: oregon
    branch: main
    healthCheckPath: /health
    routes:
      - type: rewrite
        source: /api/*
        destination: http://plagiarism-api:8000/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://plagiarism-api.onrender.com/api/v1

  # 2. Backend FastAPI Application Service
  - type: web
    name: plagiarism-api
    env: docker
    dockerfilePath: apps/backend/Dockerfile
    dockerContext: apps/backend
    plan: standard
    region: oregon
    branch: main
    healthCheckPath: /health
    disk:
      name: plagiarism-storage
      mountPath: /app/storage
      sizeGB: 10
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_RUNTIME_MODE
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: PORT
        value: "8000"
      - key: STORAGE_ROOT_DIR
        value: /app/storage
      - key: LOCAL_PRIVATE_STORAGE_ROOT
        value: /app/storage/private
      - key: DATABASE_URL
        fromDatabase:
          name: plagiarism-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: plagiarism-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: SEMANTIC_MODEL_NAME
        value: intfloat/multilingual-e5-small
      - key: SEMANTIC_EMBEDDING_DIM
        value: "384"
      - key: CHROMIUM_PATH
        value: /usr/bin/chromium
      - key: CORS_ORIGINS
        value: '["https://plagiarism-web.onrender.com"]'

  # 3. Python RQ Background Worker Service
  - type: worker
    name: plagiarism-worker
    env: docker
    dockerfilePath: apps/backend/Dockerfile
    dockerContext: apps/backend
    dockerCommand: python -m plagiarism.jobs.worker
    plan: standard
    region: oregon
    branch: main
    disk:
      name: plagiarism-storage
      mountPath: /app/storage
      sizeGB: 10
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: APP_RUNTIME_MODE
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: STORAGE_ROOT_DIR
        value: /app/storage
      - key: LOCAL_PRIVATE_STORAGE_ROOT
        value: /app/storage/private
      - key: DATABASE_URL
        fromDatabase:
          name: plagiarism-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: plagiarism-redis
          property: connectionString
      - key: SEMANTIC_MODEL_NAME
        value: intfloat/multilingual-e5-small
      - key: SEMANTIC_EMBEDDING_DIM
        value: "384"
      - key: CHROMIUM_PATH
        value: /usr/bin/chromium

# Managed Database and Queue
databases:
  - name: plagiarism-postgres
    plan: standard
    region: oregon
    databaseName: plagiarism_platform
    user: plagiarism_user
    postgresMajorVersion: 16
    ipAllowList: [] # internal only

# Managed Redis Queue
redis:
  - name: plagiarism-redis
    plan: starter
    region: oregon
    ipAllowList: [] # internal only
