name: Production CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Backend, Frontend, and Container Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: plagiarism_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev_password_change_in_production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d plagiarism_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies for Indic Shaping and Headless Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-deva fonts-telu chromium-browser

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./apps/backend[dev]"

      - name: Run Backend Pytest Suite
        env:
          APP_RUNTIME_MODE: local
          DATABASE_URL: postgresql+asyncpg://postgres:postgres_dev_password_change_in_production@localhost:5432/plagiarism_platform
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest apps/backend/tests -v

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package.json

      - name: Install Web Dependencies & Run Vitest Suite
        run: |
          cd apps/web
          npm ci
          npm run test -- --run
          npm run build

      - name: Build Backend Docker Image
        run: |
          docker build -t plagiarism-api:latest -f apps/backend/Dockerfile apps/backend

      - name: Build Web Docker Image
        run: |
          docker build -t plagiarism-web:latest -f apps/web/Dockerfile apps/web
