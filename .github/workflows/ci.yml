name: Continuous Integration — Engineering Foundation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  contract-validation:
    name: OpenAPI Contract Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate OpenAPI 3.1 Contract Structure
        run: |
          python -m pip install pyyaml jsonschema
          python -c "
          import yaml
          with open('contracts/openapi.yaml', 'r', encoding='utf-8') as f:
              spec = yaml.safe_load(f)
          assert spec['openapi'].startswith('3.1'), f'Unexpected openapi version {spec.get(\"openapi\")}'
          assert '/health' in spec['paths'], 'Missing /health path'
          assert 'HealthStatus' in spec['components']['schemas'], 'Missing HealthStatus schema'
          assert 'ErrorEnvelope' in spec['components']['schemas'], 'Missing ErrorEnvelope schema'
          print('OpenAPI contract structurally verified.')
          "

  backend-ci:
    name: Backend CI (FastAPI, pgvector, RQ)
    runs-on: ubuntu-latest
    needs: contract-validation
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: plagiarism_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password_secure_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d plagiarism_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: apps/backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio httpx ruff

      - name: Lint Code with Ruff
        working-directory: apps/backend
        run: |
          ruff check src tests

      - name: Apply Alembic Migrations Against pgvector
        working-directory: apps/backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: plagiarism_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password_secure_123
          JWT_SECRET_KEY: test_super_secure_jwt_secret_key_minimum_32_characters_long_for_security
        run: |
          alembic upgrade head

      - name: Run Backend Pytest Suite
        working-directory: apps/backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: plagiarism_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password_secure_123
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET_KEY: test_super_secure_jwt_secret_key_minimum_32_characters_long_for_security
          ENVIRONMENT: testing
        run: |
          pytest -v tests

  frontend-ci:
    name: Frontend CI (React, Vite, TypeScript)
    runs-on: ubuntu-latest
    needs: contract-validation
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: |
          npm ci || npm install

      - name: TypeScript Typecheck
        working-directory: apps/web
        run: |
          npm run typecheck

      - name: Run Vitest Unit Suite
        working-directory: apps/web
        run: |
          npm run test

      - name: Build Production SPA Bundle
        working-directory: apps/web
        run: |
          npm run build
